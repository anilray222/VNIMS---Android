name: Build VNIMS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract VNIMS Android project
        run: |
          test -f VNIMS-Android-Source.zip
          mkdir -p android-src
          unzip -q VNIMS-Android-Source.zip -d android-src
          test -f android-src/settings.gradle
          test -f android-src/app/build.gradle

      - name: Build debug APK
        run: gradle -p android-src :app:assembleDebug

      - name: Upload VNIMS APK
        uses: actions/upload-artifact@v4
        with:
          name: VNIMS-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
